name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run scenarios
      - run: npx playwright install --with-deps chromium
      - run: npm run pages:check -w @ccp/harness -- --shots shots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: page-shots
          path: packages/harness/shots
